name: abogator
description: "Frontend de AboGator: tarjetas deslizables para aprender Derecho Informático."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/imagenes/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fuentes/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/Fredoka-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fuentes/Inter-Regular.ttf
          weight: 400
        - asset: assets/fuentes/Inter-Medium.ttf
          weight: 500
        - asset: assets/fuentes/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fuentes/JetBrainsMono-Regular.ttf
          weight: 400
